name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Build site with minification
        run: hugo --minify --baseURL "$BASE_URL"
        env:
          BASE_URL: 'https://${{ github.repository_owner }}.github.io/my-portfolio/'

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_branch: gh-pages
          publish_dir: ./public
          external_clobber: true
