imageHeight = 150
imageTitle = 'Shane Schisler'
title = "Hi, I'm a Software Engineer & Thinker 👋"
subtitle = 'Welcome to my digital home. Here I document my personal engineering projects and write down my thoughts on system architecture and problem-solving.'

[[params.profileMode.buttons]]
name = '📄 Download CV'
url = '/resume.pdf'

