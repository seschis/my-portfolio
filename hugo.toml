ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
comments = false
assetsDir = 'assets'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/seschis'

[[params.socialIcons]]
name = 'linkedin'
url = 'https://www.linkedin.com/in/shaneschisler'

[params.profileMode]
enabled = true
imageUrl = '/images/profile.jpg'
