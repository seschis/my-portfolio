baseURL = 'https://seschis.github.io/my-portfolio/'
locale = 'en-us'
title = 'Shane Schisler'
theme = 'PaperMod'

[markup.goldmark.renderer]
unsafe = true

[params]
env = 'production'
description = 'Shane Schisler builds tools that solve hard problems across cybersecurity, embedded systems, kernels, reverse engineering, and LLM agents.'
defaultTheme = 'auto'
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
comments = false
assetsDir = 'assets'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/seschis'

[[params.socialIcons]]
name = 'linkedin'
url = 'https://www.linkedin.com/in/shaneschisler'

[params.profileMode]
enabled = true
imageUrl = 'images/profile.jpg'
imageWidth = 150
imageHeight = 150
imageTitle = 'Shane Schisler'
title = "Hi, I'm Shane Schisler"
subtitle = 'I like building tools that solve real problems, and I like hard puzzles. My work has spanned cybersecurity, embedded systems, kernel and driver development, reverse engineering, high-performance systems, and deep learning. That path led me to LLMs and agents, and to finding out what they can do on security problems. I know the stack from the kernel up to the application, so I like to go deep.'

[[params.profileMode.buttons]]
name = '📄 Download CV'
url = 'resume.pdf'

