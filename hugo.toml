[markup.goldmark.renderer]
unsafe = true

[params]
env = 'production'
description = 'Shane Schisler builds tooling that makes AI agents do security work reliably, after 25 years of kernels, hypervisors, and reverse engineering.'
defaultTheme = 'auto'
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
comments = false
assetsDir = 'assets'

[[params.socialIcons]]
name = 'github'
url = 'https://github.com/seschis'

[[params.socialIcons]]
name = 'linkedin'
url = 'https://www.linkedin.com/in/shaneschisler'

[params.profileMode]
enabled = true
imageUrl = 'images/profile.jpg'
imageWidth = 150
imageHeight = 150
imageTitle = 'Shane Schisler'
title = "Hi, I'm Shane Schisler"
subtitle = 'I build the tooling that makes AI agents do security work reliably. I came to it after 25 years of kernels, hypervisors, and reverse engineering, which is why my first question about any agent is where it breaks and how to prove it does not.'

[[params.profileMode.buttons]]
name = '📄 Download CV'
